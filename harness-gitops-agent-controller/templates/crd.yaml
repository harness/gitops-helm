{{- if .Values.crds.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: harnessgitopsagents.infrastructure.kandylis.co.uk
spec:
  group: infrastructure.kandylis.co.uk
  names:
    kind: HarnessGitopsAgent
    listKind: HarnessGitopsAgentList
    plural: harnessgitopsagents
    shortNames:
    - hga
    singular: harnessgitopsagent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.agentIdentifier
      name: Agent
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: HarnessGitopsAgent is the Schema for the harnessgitopsagents
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HarnessGitopsAgent
            properties:
              accountId:
                description: AccountId is the Harness Account Identifier
                type: string
              apiKeySecretRef:
                description: |-
                  ApiKeySecretRef is the name of the Secret containing the Harness API Key.
                  Key inside secret must be "api_key".
                type: string
              existingAgentIdentifier:
                description: |-
                  ExistingAgentIdentifier, if set, skips agent creation and reuses this already-running
                  agent for project mapping. TokenSecretRef is not required in this mode.
                type: string
              identifier:
                description: Identifier is the unique identifier of the Harness GitOps
                  Agent
                type: string
              name:
                description: Name is the name of the Harness GitOps Agent
                type: string
              operator:
                description: Type of GitOps Operator ("ARGO", "FLAMINGO")
                type: string
              orgId:
                description: OrgId is the Harness Organization Identifier
                type: string
              projectId:
                description: ProjectId is the Harness Project Identifier
                type: string
              scope:
                default: PROJECT
                description: Scope of the agent (e.g., "ACCOUNT", "ORG", "PROJECT")
                enum:
                - ACCOUNT
                - ORG
                - PROJECT
                type: string
              tokenSecretRef:
                description: |-
                  TokenSecretRef is the name of the Secret where the generated Agent Token will be stored.
                  The controller writes GITOPS_AGENT_TOKEN into this secret.
                  Not required when ExistingAgentIdentifier is set.
                type: string
              type:
                default: MANAGED_ARGO_PROVIDER
                description: Type of agent (e.g., "MANAGED_ARGO_PROVIDER")
                enum:
                - MANAGED_ARGO_PROVIDER
                - CONNECTED_ARGO_PROVIDER
                type: string
            required:
            - accountId
            - apiKeySecretRef
            - identifier
            - name
            - operator
            type: object
            x-kubernetes-validations:
            - message: Harness agent identity is immutable; replace the resource instead
              rule: self.name == oldSelf.name && self.operator == oldSelf.operator
                && self.identifier == oldSelf.identifier && self.accountId == oldSelf.accountId
                && self.type == oldSelf.type && self.scope == oldSelf.scope && has(self.orgId)
                == has(oldSelf.orgId) && (!has(self.orgId) || self.orgId == oldSelf.orgId)
                && has(self.projectId) == has(oldSelf.projectId) && (!has(self.projectId)
                || self.projectId == oldSelf.projectId) && has(self.existingAgentIdentifier)
                == has(oldSelf.existingAgentIdentifier) && (!has(self.existingAgentIdentifier)
                || self.existingAgentIdentifier == oldSelf.existingAgentIdentifier)
          status:
            description: status defines the observed state of HarnessGitopsAgent
            properties:
              agentIdentifier:
                description: AgentIdentifier is the ID returned by Harness after agent
                  registration.
                type: string
              agentOwnership:
                description: |-
                  AgentOwnership determines whether finalization may delete the remote agent.
                  Empty means ownership was not proven and is handled as external.
                enum:
                - Managed
                - Adopted
                - External
                type: string
              conditions:
                description: Conditions store the detailed state transitions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              creationState:
                description: |-
                  CreationState records durable create intent until the Harness Agent is
                  verified as owned by this exact Kubernetes resource.
                enum:
                - Pending
                - OutcomeUnknown
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
