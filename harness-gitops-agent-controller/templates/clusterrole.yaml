{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harness-gitops-agent-controller.fullname" . }}-manager
  labels:
    {{- include "harness-gitops-agent-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    verbs: ["get"]
  - apiGroups: ["gitops.harness.io"]
    resources: ["harnessgitopsagents"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["gitops.harness.io"]
    resources:
      - harnessgitopsagents/finalizers
      - harnessgitopsprojectmappings/finalizers
    verbs: ["update"]
  - apiGroups: ["gitops.harness.io"]
    resources:
      - harnessgitopsagents/status
      - harnessgitopsprojectmappings/status
    verbs: ["get", "patch", "update"]
  - apiGroups: ["gitops.harness.io"]
    resources: ["harnessgitopsprojectmappings"]
    verbs: ["delete", "get", "list", "patch", "update", "watch"]
{{- end }}
