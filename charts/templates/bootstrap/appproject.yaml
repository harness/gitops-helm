{{- /* Keep the AppProject as a normal release resource. Helm then patches it
in place on upgrade and removes it on uninstall instead of replacing an
untracked hook object. */}}
{{- if .Values.appProject.enabled }}
{{- if not (.Capabilities.APIVersions.Has "argoproj.io/v1alpha1/AppProject") }}
{{- fail "appProject.enabled requires the AppProject CRD to exist before this Helm render; install the runtime with appProject.enabled=false first, or use an existing Argo CD installation" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ default "default" .Values.appProject.name | quote }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.appProject.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "harness-gitops-agent-bootstrap.labels" . | nindent 4 }}
    {{- with .Values.appProject.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  description: {{ .Values.appProject.description | quote }}
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
