{{- if .Values.harness.developerMirrordRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-mirrord
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "harness.agentLabels" (dict "context" . "component" "developer-mirrord" "name" "developer-mirrord") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-mirrord
subjects:
{{- range .Values.harness.developerMirrordRbac.users }}
- kind: User
  name: {{ . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
